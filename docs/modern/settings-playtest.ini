version = 2

# GT4 Native: the playtest settings (2026-11-09). Not a preset: the work that isn't in any preset yet, switched on so
# you can try it, over the handheld's performance settings. To use it, keep a copy of your settings.ini, then copy
# this file over settings.ini (beside gt4_host). Each line below says what to look for. To compare with what you had,
# set that line back as its comment says (or open Settings in the game), or put your old settings.ini back.

# The handheld's performance settings (as settings-handheld.ini). The preset comes first; the lines after change it.
[graphics]
preset = low

[render]
upscaler = fsr1
# The modern renderer draws GT4's 3D scenes (the same picture, through its own stages). It costs CPU: about 31 % more
# on the front end and 0.35 ms more a frame on the desktop, never measured on this device. A lower frame rate with
# it is a known cost to report (how much, where), not a bug. Compare with scene = original.
scene = hybrid

[effects]
ambient_occlusion = off
mirror = original

[lighting]
# The course's street lamps also light the road and the cars near them, over GT4's own lamp light (nothing of GT4's
# is removed). Look for pools of light under the lamps on the night courses (S.S. Route 5 and Clubman Stage Route 5)
# and Hong Kong at dusk; report lamps that light nothing, light in the wrong place, or flicker. Its cost on this
# device isn't measured yet either. Compare with night = original.
night = enhanced

[audio]
# The host mixes GT4's sound effects and voices (GT4 still decides what plays). Listen for crackles, drop-outs or
# sounds out of time, and say when they happen. Its cost on this device isn't measured yet. Compare with mixer = game.
mixer = host
# With the host's mixer: each car's sounds (engine, tyres) panned to where the car is, left to right; other sounds
# stay as GT4 pans them. A car behind no longer sounds hollow (GT4 played those with one side's phase inverted, for
# the surround decoders of its day). Compare with spatial = original.
spatial = stereo

[display]
mode = borderless
frame_interpolation = off
race_frames = progressive
# The menus' interlaced screens: both fields half and half, as every preset does (the PS2's picture without its
# bob). Here only so it's stated; clean is the other choice (it shakes moving content: known, parked as E10).
field_mode = blend

[aspect]
ratio = 16:9

[ui]
# Settings inside the game: GT4's own Options items (the top menu, the pre-race menus) open this game's settings
# pages, and Esc, Guide or Select + Start open them over a menu screen. During a load, a movie or a race they wait
# for the next menu screen and say so; in a race, Start gives the pause page below, with Settings in it. Look for
# pages that don't open, can't be left, or show the wrong value. Compare with entry = hotkey.
# (A host older than the settings pages ignores this line and the next, and says so in host.log.)
entry = integrated
# The race pause: this game's pause page (Continue, Retry, Exit, Screen, Settings) in place of GT4's. Look for a
# race that doesn't hold, or doesn't resume the same. Compare with pause = gt4.
pause = native
