name: GT4 bulk source inventory
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/import_decomp.py'
      - 'tests/test_import_decomp.py'
      - 'tools/triage_native.py'
      - 'tests/test_triage_native.py'
      - 'tools/native_link_gate.py'
      - 'tests/test_native_link_gate.py'
      - 'tools/integration_queue.py'
      - 'tests/test_integration_queue.py'
      - '.github/workflows/import-decomp.yml'
  pull_request:
    paths:
      - 'tools/import_decomp.py'
      - 'tests/test_import_decomp.py'
      - 'tools/triage_native.py'
      - 'tests/test_triage_native.py'
      - 'tools/native_link_gate.py'
      - 'tests/test_native_link_gate.py'
      - 'tools/integration_queue.py'
      - 'tests/test_integration_queue.py'
      - '.github/workflows/import-decomp.yml'

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify importer unit tests
        run: python3 -m unittest discover -s tests -p test_import_decomp.py -v
      - name: Verify native triage tests
        run: python3 -m unittest discover -s tests -p test_triage_native.py -v
      - name: Verify compile and link gate tests
        run: python3 -m unittest discover -s tests -p test_native_link_gate.py -v
      - name: Verify integration review queue tests
        run: python3 -m unittest discover -s tests -p test_integration_queue.py -v
      - name: Checkout pinned GT4 decomp sources
        uses: actions/checkout@v4
        with:
          repository: gustavocanepa/gt4-decomp
          ref: 69c3585cff2a48f98c6cc9c2c495012d28c022cd
          path: upstream-checkout
          persist-credentials: false
      - name: Import every available source translation unit and header
        run: |
          python3 tools/import_decomp.py \
            --upstream upstream-checkout \
            --dest bulk-import/gt4 \
            --manifest bulk-import/manifest.json \
            --commit 69c3585cff2a48f98c6cc9c2c495012d28c022cd
      - name: Verify import file count and hashes
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path('bulk-import/manifest.json').read_text())
          assert manifest['translation_units'] > 10000, manifest['translation_units']
          assert manifest['files'] == len(manifest['records'])
          for rec in manifest['records']:
              path = pathlib.Path('bulk-import/gt4') / rec['path']
              assert hashlib.sha256(path.read_bytes()).hexdigest() == rec['sha256'], rec['path']
          print(f"Verified {manifest['translation_units']} translation units, {manifest['files']} files")
          PY
      - name: Rank native integration candidates and probe syntax
        run: |
          python3 tools/triage_native.py \
            --manifest bulk-import/manifest.json \
            --source-root bulk-import/gt4 \
            --output bulk-import/native-triage.json \
            --top 250 --probe 30 --compiler clang++
      - name: Compile and link isolated candidates
        run: |
          python3 tools/native_link_gate.py \
            --triage bulk-import/native-triage.json \
            --source-root bulk-import/gt4 \
            --output bulk-import/native-link-report.json \
            --max-units 20
      - name: Generate hash-verified integration review queue
        run: |
          python3 tools/integration_queue.py \
            --manifest bulk-import/manifest.json \
            --triage bulk-import/native-triage.json \
            --link-report bulk-import/native-link-report.json \
            --source-root bulk-import/gt4 \
            --output bulk-import/integration-queue.json \
            --native-repo .
      - name: Publish integration queue summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path('bulk-import/integration-queue.json').read_text())
          counts = report['counts']
          lines = [
              '## GT4 native integration review',
              '',
              f"Upstream revision: `{report['upstream_commit']}`",
              f"Imported translation units: **{report['total_imported_translation_units']}**",
              f"Candidates evaluated by the compile/link gate: **{report['evaluated_candidates']}**",
              '',
              '| Classification | Count |',
              '| --- | ---: |',
          ]
          for status in ('review_ready', 'needs_link_dependencies', 'needs_compile_fixes', 'already_integrated'):
              lines.append(f"| {status.replace('_', ' ')} | {counts.get(status, 0)} |")
          lines.extend(['', '### First candidates for manual review', '',
                        '| Source path | Classification | Compile | Executable link |',
                        '| --- | --- | --- | --- |'])
          for item in report['queue'][:15]:
              path = item['path'].replace('|', '\\|').replace('\\n', ' ')
              lines.append(f"| `{path}` | {item['status']} | {item['compile']} | {item['executable_link']} |")
          lines.extend(['', '**Important:** An isolated link does not establish correct ABI, behavior, or runtime integration. No game code is automatically integrated by this workflow.'])
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(summary)
          PY
      - name: Package all imported sources and dependency manifest
        uses: actions/upload-artifact@v4
        with:
          name: gt4-decomp-bulk-import
          path: bulk-import/
          retention-days: 14
          compression-level: 6
