name: Native C++ validation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    name: Source provenance and generated adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/adapt_object_fields.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc, config: Debug, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, compiler: gcc, config: Release, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, compiler: clang, config: Debug, cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, compiler: clang, config: Release, cc: clang, cxx: clang++ }
          - { os: windows-latest, compiler: msvc, config: Debug }
          - { os: windows-latest, compiler: msvc, config: Release }
          - { os: macos-latest, compiler: appleclang, config: Debug }
          - { os: macos-latest, compiler: appleclang, config: Release }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTING=ON -DGT4_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --timeout 30
      - name: Package Windows demo executable
        if: matrix.os == 'windows-latest' && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: gt4-native-windows-object-demo
          path: build/Release/gt4_native.exe
          if-no-files-found: error

  sanitizers:
    name: Linux Clang ASan + UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DGT4_ENABLE_SANITIZERS=ON -DGT4_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure --timeout 30

  # The SDL3 + Vulkan host (PLAN.md C4, R4): what CI can build without the game's private sources or a disc. Nothing
  # proprietary goes in: no game, no captures, no BIOS; the caches hold only zig and Ubuntu's own packages. Tests that
  # need a capture or a GPU skip (77); Linux runs Mesa's lavapipe, so its host_replay runs for real.
  host-windows:
    name: Host / Windows x64 (ctest) + ARM64 (cross)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Python for the tools' selftests
        run: python -m pip install --quiet numpy
      - name: x64, build and ctest (tools/build_windows.cmd)
        shell: cmd
        run: tools\build_windows.cmd Release
      - name: The x64 build's glslang, for the ARM64 build's shaders
        shell: pwsh
        run: |
          $g = Get-ChildItem build\host-windows-Release\_deps -Recurse -Filter glslang.exe | Select-Object -First 1
          if (-not $g) { throw "no glslang.exe in the x64 build" }
          "GT4_GLSLANG_EXECUTABLE=$($g.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: ARM64, cross build (tools/build_windows.cmd, GT4_ARCH=arm64)
        shell: cmd
        env:
          GT4_ARCH: arm64
        run: tools\build_windows.cmd Release
      # A build folder beside the source, not inside it (CMakeLists.txt's /pathmap: a mapping that let one folder's
      # name map back into the other broke such builds in SDL's precompiled header, C1083): SDL and one of ours.
      - name: x64, a build folder beside the checkout (SDL's precompiled header, gt4_gs)
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSPATH=%%i
          call "%VSPATH%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64 -no_logo || exit /b 1
          cmake -S . -B ..\gt4-beside -G Ninja -DCMAKE_BUILD_TYPE=Release -DGT4_BUILD_HOST=ON -DBUILD_TESTING=OFF || exit /b 1
          cmake --build ..\gt4-beside --target SDL3-static gt4_gs || exit /b 1
      - uses: actions/upload-artifact@v4
        with:
          name: gt4-host-windows
          path: |
            build/host-windows-Release/gt4_host.exe
            build/host-windows-arm64-Release/gt4_host.exe
          if-no-files-found: error

  host-linux:
    name: Host / Linux ${{ matrix.arch }} (tools/build_linux.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    env:
      GT4_LINUX_TOOLS: ${{ github.workspace }}/.linux-tools
      GT4_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - name: Build tools; lavapipe and numpy for the tests (x86_64 runs ctest)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build mesa-vulkan-drivers libvulkan1 python3-numpy
      - name: zig and the Ubuntu package sysroots (public downloads only)
        uses: actions/cache@v4
        with:
          path: .linux-tools
          key: linux-tools-${{ matrix.arch }}-${{ hashFiles('tools/build_linux.sh') }}
      - name: Build (and ctest on x86_64)
        run: bash tools/build_linux.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: gt4-host-linux-${{ matrix.arch }}
          path: build/host-linux-${{ matrix.arch == 'x86_64' && 'x64' || 'arm64' }}-Release/gt4_host
          if-no-files-found: error
