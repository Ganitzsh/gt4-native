name: Native C++ validation
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapters:
    name: Source provenance and generated adapters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/adapt_object_fields.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc, config: Debug, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, compiler: gcc, config: Release, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, compiler: clang, config: Debug, cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, compiler: clang, config: Release, cc: clang, cxx: clang++ }
          - { os: windows-latest, compiler: msvc, config: Debug }
          - { os: windows-latest, compiler: msvc, config: Release }
          - { os: macos-latest, compiler: appleclang, config: Debug }
          - { os: macos-latest, compiler: appleclang, config: Release }
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DBUILD_TESTING=ON -DGT4_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - name: Test
        run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --timeout 30
      - name: Package Windows demo executable
        if: matrix.os == 'windows-latest' && matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: gt4-native-windows-object-demo
          path: build/Release/gt4_native.exe
          if-no-files-found: error

  sanitizers:
    name: Linux Clang ASan + UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DGT4_ENABLE_SANITIZERS=ON -DGT4_STRICT_WARNINGS=ON
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure --timeout 30

  host:
    name: SDL3 + Vulkan host / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols libdecor-0-dev \
            libpulse-dev libasound2-dev libudev-dev libdbus-1-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGT4_BUILD_HOST=ON -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --timeout 30
